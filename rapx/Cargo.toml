[package]
name = "rapx"
version.workspace = true
edition.workspace = true
authors.workspace = true
default-run = "rapx"
license.workspace = true
description = "A static analysis platform for Rust program analysis and verification"
documentation = "https://safer-rust.github.io/RAPx-Book/"
repository = "https://github.com/safer-rust/RAPx"
readme = "../README.md"
exclude = ["target*/**"]

[[bin]]
name = "rapx"

[[bin]]
name = "cargo-rapx"

[lib]
name = "rapx"
doctest = false

[dependencies]
lazy_static = "1.4"
chrono = "0.4.19"
serde_json = "1.0.72"
z3 = "0.13.3"
log = "0.4.14"
fern = { version = "0.6.2", features = ["colored"] }
wait-timeout = "0.2.0"
rustc-hash = "2"
colorful = "0.2.1"
serde = "1.0.215"
regex = "1.11.1"
once_cell = "1.20.1"
paste = "1"
walkdir = "2"
cargo_metadata = "0.18"
annotate-snippets = "0.11.4"
petgraph = "0.8.1"
if_chain = "1.0"
num-traits = "0.2.19"
rand = "0.9.3"
toml = "0.8.23"
itertools = "0.14.0"
safety-parser = "0.4.3"
syn = { version = "2", features = ["extra-traits", "full", "visit-mut"] }
pest = "2"
pest_derive = "2"
quote = "1"
proc-macro2 = "1"
bit-set = "0.8.0"
rust_intervals = "0.3.0"
clap = { version = "4.5.60" }
clap-cargo = "0.18.3"
shlex = "1.3.0"
fs4 = "0.13.1"
color-print = "0.3.7"
indexmap = "2.13.0"
serde_yaml = "0.9.34"
anyhow = "1.0.102"
insta = { version = "1.46.3", features = ["yaml"] }

[features]

[package.metadata.rust-analyzer]
rustc_private = true
