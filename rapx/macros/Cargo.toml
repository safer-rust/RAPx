[package]
name = "rapx-macros"
version.workspace = true
edition.workspace = true
description = "Procedural macros for RAPx contract definitions"
license.workspace = true
repository = "https://github.com/safer-rust/RAPx"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
